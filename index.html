<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatório de produção — Usina Califórnia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Archivo+Narrow:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#eef3ee;--panel:#fff;--ink:#14231c;--mute:#5a6b63;--line:#d3ddd5;--acc:#00784a;--accink:#fff;--inbg:#f6f9f6;--soft:#e4f0e6;--deep:#00784a;--mid:#45b653;--lime:#a8cf45;--hero:#063f2b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1613;--panel:#18211d;--ink:#e6ede8;--mute:#98a9a0;--line:#2e3b35;--acc:#58c46a;--accink:#08170f;--inbg:#121a16;--soft:#1f2c25}}
:root[data-theme="dark"]{--bg:#0f1613;--panel:#18211d;--ink:#e6ede8;--mute:#98a9a0;--line:#2e3b35;--acc:#58c46a;--accink:#08170f;--inbg:#121a16;--soft:#1f2c25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:92px}
body:not(.is24) .d24{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:12px}
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:16px;padding:18px 18px 44px}
.hero svg.w{position:absolute;right:0;bottom:0;width:min(60%,420px);height:auto;pointer-events:none}
.hero .in{position:relative;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.plate{background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.plate img{display:block;height:50px;width:auto}
.hero h1{margin:0;font:700 30px/1 "Archivo Narrow",Archivo,sans-serif;letter-spacing:.03em}
.hero p{margin:5px 0 0;font-size:14px;color:#cfe8bd}
.chips{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:4px 12px;font-size:13px}
.chip b{color:var(--lime)}
.kpis{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:-26px 10px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--mid);border-radius:12px;padding:10px 14px;box-shadow:0 6px 16px -8px rgba(0,60,30,.45)}
.kpi:nth-child(2){border-left-color:var(--lime)}
.kpi:nth-child(3){border-left-color:var(--deep)}
.kpi:nth-child(4){border-left-color:#6a8f55}
.kpi span{display:block;font-size:12.5px;color:var(--mute)}
.kpi b{font:700 26px/1.1 "Archivo Narrow",Archivo,sans-serif;color:var(--acc)}
.kpi small{font-size:13px;color:var(--mute);margin-left:5px;font-weight:400}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
@media(max-width:700px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px}
.card h2{margin:0 0 12px;font:700 18px "Archivo Narrow",Archivo,sans-serif;color:var(--acc);display:flex;align-items:center;gap:9px}
.card h2::before{content:"";width:14px;height:14px;border-radius:50% 50% 50% 0;background:var(--mid);transform:rotate(45deg)}
.wide{grid-column:1/-1}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:11px}
.f{display:block}
.full{grid-column:1/-1}
.lb{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
.ig{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--inbg);transition:border-color .15s}
.ig:focus-within{border-color:var(--mid);outline:3px solid color-mix(in srgb,var(--mid) 30%,transparent)}
.ig input,.ig textarea,.ig select{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:10px 11px;outline:0}
.ig select{cursor:pointer;font-weight:700}
.ig textarea{resize:vertical}
.un{padding-right:11px;color:var(--mute);font-size:13px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 6px 12px;border-bottom:1px dashed var(--line);min-height:54px;cursor:text}
.row:last-child{border-bottom:0}
.rl{flex:1;min-width:0;font-size:14.5px;line-height:1.25}
.rows .ig{width:204px;flex:none;height:42px}
.rows .ig input,.rows .ig select{height:100%}
.nm input{text-align:right;font-variant-numeric:tabular-nums}
.rows .un{width:52px;padding:0 8px 0 0;text-align:left}
.is24 .row.d24{box-shadow:inset 4px 0 0 var(--lime);border-radius:2px}
@media(max-width:480px){.row{flex-direction:column;align-items:stretch;gap:5px;padding-top:8px;padding-bottom:10px}.rows .ig{width:100%}}
.hint{margin:10px 0 0;font-size:13px;color:var(--mute)}
.hint i{display:inline-block;width:10px;height:10px;background:var(--lime);border-radius:3px;margin-right:5px}
.st{border:1.5px solid var(--line);border-radius:12px;padding:11px;margin-bottom:10px;background:var(--inbg)}
.st .ig{background:var(--panel)}
.st-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:9px}
.dur{font-weight:700;color:var(--acc);padding:10px 2px;white-space:nowrap}
.st-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:8px}
.chk{font-size:13.5px;display:flex;gap:7px;align-items:center}
.chk input{width:18px;height:18px;accent-color:var(--deep)}
.sub{color:var(--mute);font-size:13px;margin:0 0 10px}
button{font:700 15px Archivo,sans-serif;border-radius:10px;padding:11px 16px;cursor:pointer;border:1.5px solid var(--acc)}
button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.pri{background:var(--acc);color:var(--accink)}
.sec{background:transparent;color:var(--acc)}
.rm{background:transparent;border-color:var(--line);color:var(--mute);padding:6px 11px;font-size:13px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.sum div{background:var(--soft);border-radius:10px;padding:10px 13px}
.sum b{display:block;font:700 26px/1.1 "Archivo Narrow",Archivo,sans-serif;color:var(--acc)}
.sum span{font-size:12.5px;color:var(--mute)}
.sum .key{border-left:5px solid var(--lime)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:5}
.bar .pri{flex:1;max-width:440px;font-size:16px}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:#14231c;color:#fff;padding:9px 14px;border-radius:9px;font-size:14px;display:none;z-index:6;max-width:92vw}
</style>
</head>
